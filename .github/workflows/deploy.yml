name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # varzesh3 sends no CORS headers, so the payload is pulled here and published as static JSON.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync live data from varzesh3
        env:
          DATA_MAX_LEAGUES: '16'
          DATA_MAX_DETAILS: '30'
        run: node scripts/sync-data.mjs

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
